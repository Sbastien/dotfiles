# `lint` is absent on purpose: it lives in mise-tasks/lint, where it is a real
# script rather than a shell fragment quoted inside TOML and rendered by Tera.
[tasks.fmt]
description = "reformat the sh scripts in place"
run = "shfmt -w -i 2 -ci .chezmoiscripts/*.sh mise-tasks/lint"

[tasks.doctor]
description = "read-only: config drift here, packages in the Brewfile repo"
run = ["chezmoi verify", "~/projects/Brewfile/bin/doctor"]
