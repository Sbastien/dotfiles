"$schema" = 'https://starship.rs/config-schema.json'

# Doubles starship's 500 ms default before a slow module is dropped from the
# prompt without saying so.
command_timeout = 1000

format = """
$username\
$directory\
$git_branch\
$git_commit\
$git_status\
$git_metrics\
$git_state\
$c\
$nodejs\
$python\
$ruby\
$package\
$docker_context\
$container\
$jobs\
$time\
$cmd_duration\
$status\
$line_break\
$character\
"""

palette = 'default'

[palettes.default]

color_ok = 'bright-green'
color_danger = 'bright-red'

color_username = 'red'
color_directory = 'yellow'
color_git = 'cyan'
color_git_added = 'bright-green'
color_git_deleted = 'bright-red'
color_env = 'blue'
color_docker = 'blue'
# Empty is deliberate: these four render unstyled, in the terminal's own colour.
color_container = ''
color_other = ''
color_time = ''
color_duration = ''

# Every module below overrides a starship default. A module whose defaults are
# already right is absent, not restated — `disabled = false` appears only on the
# three that ship disabled.

# Only rendered as root or over SSH, which is starship's own default.
[username]
style_user = "fg:color_username"
style_root = "bold fg:color_danger"
format = '[ $user ]($style)'

[directory]
style = "fg:color_directory"
read_only_style = "fg:color_directory"
repo_root_style = "bold fg:color_directory"
# No leading space: outside a repo nothing precedes the path any more.
format = "[$path ]($style)"
read_only = " "
truncation_symbol = "…/"
# 0 disables truncation; with truncate_to_repo the path is short anyway.
truncation_length = 0

[git_branch]
symbol = ""
style = "fg:color_git"
format = '[( $symbol $branch )]($style)'
only_attached = true
truncation_length = 25
truncation_symbol = "..."

[git_commit]
style = "fg:color_git"
format = "[(( $tag)( @$hash) )]($style)"
tag_symbol = "󰓼 "
tag_disabled = false

[git_status]
style = "fg:color_git"
format = '[($ahead_behind )($all_status )]($style)'
stashed = "*${count}"
ahead = "⇡${count}"
behind = "⇣${count}"
diverged = "⇡${ahead_count}⇣${behind_count}"
conflicted = "=${count}"
deleted = "×${count}"
renamed = "»${count}"
modified = "!${count}"
staged = "+${count}"
untracked = "?${count}"

[git_metrics]
disabled = false
format = '[(([+$added]($added_style))([-$deleted]($deleted_style)) )](fg:color_git)'
added_style = "fg:color_git_added"
deleted_style = "fg:color_git_deleted"

[git_state]
style = "fg:color_danger"
format = '[($state( $progress_current/$progress_total) )]($style bold)'

[c]
symbol = ""
style = "fg:color_env"
format = '[( $symbol( $version) )]($style)'

[nodejs]
symbol = ""
style = "fg:color_env"
format = '[( $symbol( $version) )]($style)'

[python]
symbol = ""
style = "fg:color_env"
format = '[( $symbol( $version)( $virtualenv) )]($style)'
version_format = '${raw}'

[ruby]
symbol = ""
style = "fg:color_env"
format = '[( $symbol( $version) )]($style)'

[package]
symbol = "󰏗"
style = "fg:color_env"
format = '[( $symbol( $version) )]($style)'

[docker_context]
symbol = ""
style = "fg:color_docker"
format = '[( $symbol( $context) )]($style)'

[container]
style = "fg:color_container"
format = '[ $symbol $name ]($style)'

[jobs]
symbol = "󰒋"
style = "fg:color_other"
format = '[ $symbol( $number) ]($style)'
number_threshold = 1

[time]
disabled = false
time_format = "%R"
style = "fg:color_time"
format = '[ 󰔛 $time ]($style)'

[cmd_duration]
format = '[ 󱫑 $duration ]($style)'
style = 'fg:color_duration'

[status]
disabled = false
format = '[( $symbol( $common_meaning)( $signal_name) )]($style)'
map_symbol = true
pipestatus = true
symbol = '󰅙'
not_executable_symbol = '󰂭'
not_found_symbol = '󰍉'
sigint_symbol = '󰐊'
signal_symbol = '󱐋'
style = 'bold fg:color_danger'

[character]
success_symbol = '[❯](bold fg:color_ok)'
error_symbol = '[❯](bold fg:color_danger)'
