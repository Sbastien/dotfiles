# There is no zsh plugin framework. .zshrc sources two of these clones directly,
# zsh-autosuggestions and zsh-syntax-highlighting. zsh-completions is never
# sourced: only its src/ is prepended to fpath, so deleting it for want of a
# source line drops 192 completion definitions and reports nothing -- a missing
# fpath entry is not an error.
# --ff-only fails the pull on a rewritten upstream history instead of merging it.

[".local/share/zsh/plugins/zsh-syntax-highlighting"]
    type = "git-repo"
    url = "https://github.com/zsh-users/zsh-syntax-highlighting.git"
    refreshPeriod = "168h"
    [".local/share/zsh/plugins/zsh-syntax-highlighting".pull]
        args = ["--ff-only"]

[".local/share/zsh/plugins/zsh-autosuggestions"]
    type = "git-repo"
    url = "https://github.com/zsh-users/zsh-autosuggestions.git"
    refreshPeriod = "168h"
    [".local/share/zsh/plugins/zsh-autosuggestions".pull]
        args = ["--ff-only"]

[".local/share/zsh/plugins/zsh-completions"]
    type = "git-repo"
    url = "https://github.com/zsh-users/zsh-completions.git"
    refreshPeriod = "168h"
    [".local/share/zsh/plugins/zsh-completions".pull]
        args = ["--ff-only"]
